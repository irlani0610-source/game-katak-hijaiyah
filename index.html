<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lomba Katak Hijaiyah</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;color:#124;background:linear-gradient(#8fdcff,#d6f5ff 35%,#37b6d4 35%,#0b6f94);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding:10px}
h1{margin:6px 0;text-align:center;font-size:clamp(22px,5vw,34px);color:#0a5a2a;text-shadow:0 2px 0 #fff,0 4px 8px rgba(0,0,0,.25)}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 8px 0 #1b8aa8,0 14px 24px rgba(0,0,0,.25);margin:10px 0}
.hide{display:none!important}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid #7ac;margin:6px 0}
.btn{font:inherit;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(#5fd35f,#2ca02c);border:0;border-radius:18px;padding:12px 22px;box-shadow:0 5px 0 #1d7a1d;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d7a1d}
#pond{position:relative;height:200px;overflow:hidden;border-radius:24px;border:5px solid #fff;background:linear-gradient(#4fc3e0,#1479a3);box-shadow:0 8px 0 #0d5f80,inset 0 -20px 40px rgba(0,60,100,.4)}
#track{position:absolute;top:0;left:0;height:100%;width:4600px;transition:transform .8s ease}
.pad{position:absolute;bottom:44px;width:84px;height:36px;border-radius:50%;background:radial-gradient(ellipse at 35% 30%,#9cf27a,#3fae3a 60%,#1f7a2a);box-shadow:0 6px 0 #17601f,0 12px 10px rgba(0,40,60,.4);font-weight:800;font-size:14px;color:#0b4d14;text-align:center;line-height:30px;animation:bob 3s ease-in-out infinite}
.pad:nth-child(even){animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(4px)}}
.land{position:absolute;bottom:0;left:4300px;width:280px;height:96px;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 0,#c7f27a,#4aa83a 60%,#2f7a26);font-size:44px;text-align:center;padding-top:2px}
.frog{position:absolute;bottom:68px;width:70px;text-align:center;transition:left .7s ease}
.fi{display:block;font-size:56px;line-height:1;filter:drop-shadow(0 6px 3px rgba(0,0,0,.35))}
.hop .fi{animation:hop .7s}
.party .fi{animation:hop .5s infinite}
@keyframes hop{45%{transform:translateY(-75px) scale(1.2) rotate(-8deg)}}
.sink .fi{animation:sink 1.1s forwards}
@keyframes sink{30%{transform:translateY(8px) rotate(20deg)}100%{transform:translateY(70px) rotate(90deg) scale(.5);opacity:0}}
.back .fi{animation:fade .8s}
@keyframes fade{from{opacity:0}}
.splash{position:absolute;font-size:36px;opacity:0;pointer-events:none}
.bar{display:flex;justify-content:space-between;font-weight:700;font-size:16px;gap:8px;flex-wrap:wrap}
.lvl{display:inline-block;background:#ffd23f;border-radius:999px;padding:2px 14px}
.q{font-size:clamp(22px,5.5vw,30px);font-weight:700;text-align:center;margin:12px 0}
.ar{font-size:1.5em;direction:rtl;display:inline-block;color:#b3262e;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;line-height:1.3}
.blank{display:inline-block;width:70px;border-bottom:4px dotted #333;margin:0 4px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:clamp(20px,5vw,26px);font-weight:700;padding:12px;border-radius:18px;border:3px solid #7ac;background:#f0faff;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{background:#b6f5b0;border-color:#2ca02c}
.opt.no{background:#ffc9c9;border-color:#d33}
#fb{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin-top:8px}
.center{text-align:center}
#cert{border:10px double #c8961a;background:#fffbea;padding:22px;text-align:center;border-radius:12px}
#cert h2{font-size:30px;margin:4px 0;color:#9a6b00}
#cert .nm{font-size:34px;font-weight:800;color:#0a5a2a;border-bottom:3px dotted #999;display:inline-block;padding:0 20px;margin:8px 0}
@media print{body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%}body{background:#fff}}
</style></head>
<body><div class="wrap">
<h1>🐸 Lomba Katak Hijaiyah 🐸</h1>
<div id="pond"><div id="track"></div></div>

<div class="card" id="s0">
<div class="center" style="font-size:20px">Ayo bantu katak menyeberangi kolam! 🪷<br>Jawaban benar: katak melompat. Jawaban salah: katak tenggelam!</div>
<input type="text" id="nm" placeholder="Nama kamu" maxlength="40">
<input type="text" id="kl" placeholder="Kelas (contoh: 1A)" maxlength="12">
<div class="center" style="margin-top:8px"><button class="btn" id="go">Mulai Lomba! 🚀</button></div>
</div>

<div class="card hide" id="s1">
<div class="bar"><span class="lvl" id="lv"></span><span id="pr"></span><span id="sc"></span></div>
<div id="body"></div>
<div id="fb"></div>
</div>

<div class="card hide" id="s2">
<div class="center" style="font-size:26px;font-weight:800">🎉 Hore! Katak sampai di daratan! 🎉</div>
<div class="center" style="font-size:22px;margin:6px 0" id="res"></div>
<div id="cert"><div style="font-size:40px">🏆</div><h2>SERTIFIKAT JUARA</h2>
<div>Diberikan kepada</div><div class="nm" id="cn"></div>
<div id="cc"></div>
<div style="margin-top:8px">yang telah menyelesaikan Lomba Katak<br>Materi Huruf Hijaiyah dengan skor</div>
<div style="font-size:44px;font-weight:800;color:#b3262e" id="cs"></div>
<div id="cd" style="margin-top:6px"></div></div>
<div class="center" style="margin-top:12px"><button class="btn" onclick="window.print()">🖨️ Cetak Sertifikat</button> <button class="btn" onclick="location.reload()" style="background:linear-gradient(#5ab6ff,#1f78d1);box-shadow:0 5px 0 #14569c">Main Lagi</button></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
let AC;function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function tone(f,t,d,ty,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=ty||'sine';o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v||.25,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.05)}
const sOk=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.25));
const sNo=()=>[330,247,165].forEach((f,i)=>tone(f,i*.25,.35,'sawtooth',.16));
const sWin=()=>[523,523,659,784,659,784,1047,1047,1319].forEach((f,i)=>tone(f,i*.16,.32,'triangle',.3));

const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const BS=[["Huruf hijaiyah disebut juga huruf Arab.",1],["Jumlah huruf hijaiyah ada 29 huruf.",1],["Huruf hijaiyah dimulai dari huruf ب.",0],["Huruf terakhir hijaiyah adalah ي.",1],["Huruf ج dibaca Jim.",1],["Huruf م dibaca Nun.",0],["Membaca huruf hijaiyah dimulai dari kanan ke kiri.",1],["Al-Qur’an ditulis menggunakan huruf Latin.",0],["Kita harus rajin berlatih membaca huruf hijaiyah.",1],["Huruf hijaiyah dibaca dari kiri ke kanan.",0]];
const PG=[["Huruf hijaiyah disebut juga huruf ....",["Latin","Arab","Jawa"],1],["Jumlah huruf hijaiyah ada ....",["20","25","29"],2],["Huruf hijaiyah dimulai dari huruf ....",["ا","ب","ت"],0],["Huruf hijaiyah diakhiri dengan huruf ....",["م","ي","ل"],1],["Huruf ب dibaca ....",["Ba","Ta","Tsa"],0],["Huruf ج dibaca ....",["Ha","Jim","Kha"],1],["Membaca huruf hijaiyah dimulai dari arah ....",["Kiri ke kanan","Atas ke bawah","Kanan ke kiri"],2],["Huruf م dibaca ....",["Mim","Nun","Waw"],0],["Salah satu huruf yang keluar dari lidah adalah ....",["ب","ج","ل"],2],["Al-Qur’an ditulis menggunakan huruf ....",["Hijaiyah","Latin","Angka"],0]];
const JD=[["ا","Alif"],["ب","Ba"],["ت","Ta"],["ث","Tsa"],["ج","Jim"],["ح","Ha"],["د","Dal"],["ر","Ra"],["س","Sin"],["م","Mim"]];
const IS=[["Huruf hijaiyah disebut juga huruf ....",["arab"]],["Jumlah huruf hijaiyah ada .... huruf.",["29"]],["Huruf pertama hijaiyah adalah ....",["alif","ا"]],["Huruf terakhir hijaiyah adalah ....",["ya","yaa","ي"]],["Huruf ا dibaca ....",["alif"]],["Huruf ت dibaca ....",["ta"]],["Huruf س dibaca ....",["sin"]],["Huruf ن dibaca ....",["nun"]],["Huruf ي dibaca ....",["ya","yaa"]],["Kita membaca huruf hijaiyah dimulai dari kanan ke ....",["kiri"]]];
const LV=[["Level 1: Sangat Mudah","Benar atau Salah? 👍👎"],["Level 2: Mudah","Pilih jawaban yang benar! ✅"],["Level 3: Sedang","Pasangkan huruf dengan namanya! 🔤"],["Level 4: Sulit","Ketik jawabanmu pada titik-titik! ✏️"]];
const Q=[];
BS.forEach(x=>Q.push({t:'bs',q:'Benar atau salah? '+x[0],o:['Benar','Salah'],a:x[1]?0:1}));
PG.forEach(x=>{const o=sh(x[1].map((v,i)=>[v,i==x[2]]));Q.push({t:'pg',q:x[0],o:o.map(z=>z[0]),a:o.findIndex(z=>z[1])})});
JD.forEach(x=>{const o=sh([x[1],...sh(JD.filter(y=>y!=x).map(y=>y[1])).slice(0,3)]);Q.push({t:'jd',q:'Huruf '+x[0]+' dibaca ....',o,a:o.indexOf(x[1])})});
IS.forEach(x=>Q.push({t:'is',q:x[0],ans:x[1]}));

const track=$('#track');let h='';
for(let i=0;i<=40;i++)h+=`<div class="pad" style="left:${i*100}px">${i?i:'🏁'}</div>`;
h+='<div class="land">🌴🏝️🌴</div><div class="frog" id="frog" style="left:7px"><span class="fi">🐸</span></div><div class="splash" id="sp">💦</div>';
track.innerHTML=h;
const frog=$('#frog');
let i=0,pos=0,ok=0,lock=false,name='',kelas='';
function cam(p){track.style.transform=`translateX(${-p*100+40}px)`}
cam(0);
function ar(s){return s.replace(/[\u0600-\u06FF]+/g,'<span class="ar">$&</span>').replace('....','<span class="blank"></span>')}
function setF(c,ms){frog.classList.remove('hop','sink','back','party');void frog.offsetWidth;frog.classList.add(c);if(ms)setTimeout(()=>frog.classList.remove(c),ms)}

$('#go').onclick=()=>{name=$('#nm').value.trim();kelas=$('#kl').value.trim();
 if(!name||!kelas){alert('Isi nama dan kelas dulu ya! 😊');return}
 ac();$('#s0').classList.add('hide');$('#s1').classList.remove('hide');show()};

function show(){
 $('#fb').textContent='';
 if(i>=40)return finish();
 const L=i/10|0;
 $('#lv').textContent=LV[L][0];$('#pr').textContent='Soal '+(i+1)+'/40';$('#sc').textContent='⭐ '+ok+' benar';
 if(i%10==0){
  $('#body').innerHTML=`<div class="q">${LV[L][0]}<br><span style="font-size:.7em">${LV[L][1]}</span></div><div class="center"><button class="btn" id="st">Ayo mulai! 🐸</button></div>`;
  $('#st').onclick=()=>{ac();render()};return}
 render()}

function render(){
 lock=false;const q=Q[i];let b=`<div class="q">${ar(q.q)}</div>`;
 if(q.t=='is')b+=`<div class="center"><input type="text" id="ia" placeholder="Jawabanmu" style="max-width:320px;text-align:center" autocomplete="off" autocapitalize="off"><br><button class="btn" id="ij" style="margin-top:8px">Jawab ✔️</button></div>`;
 else b+=`<div class="opts" style="grid-template-columns:repeat(${q.t=='bs'||q.t=='jd'?2:1},1fr)">`+q.o.map((v,k)=>`<button class="opt" data-k="${k}">${ar(v)}</button>`).join('')+'</div>';
 $('#body').innerHTML=b;
 if(q.t=='is'){const f=()=>{if(lock)return;const v=$('#ia').value.toLowerCase().replace(/[\s.\-’']/g,'');if(!v)return;done(q.ans.includes(v),q.ans[0]);$('#ia').disabled=true;$('#ij').disabled=true};$('#ij').onclick=f;$('#ia').onkeydown=e=>{if(e.key=='Enter')f()};$('#ia').focus()}
 else document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(lock)return;const k=+el.dataset.k;const all=document.querySelectorAll('.opt');all.forEach(x=>x.disabled=true);all[q.a].classList.add('ok');if(k!=q.a)el.classList.add('no');done(k==q.a,q.o[q.a])})}

function done(good,right){
 lock=true;ac();
 if(good){ok++;pos++;$('#fb').innerHTML='🎉 Benar! Hebat!';sOk();setF('hop',800);frog.style.left=(pos*100+7)+'px';cam(pos)}
 else{$('#fb').innerHTML='😢 Yah, tenggelam! Jawabannya: '+ar(String(right));sNo();setF('sink',1100);const sp=$('#sp');sp.style.left=(pos*100+20)+'px';sp.style.bottom='60px';sp.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-40px)'}],{duration:900});
  setTimeout(()=>setF('back',800),1200)}
 $('#sc').textContent='⭐ '+ok+' benar';
 setTimeout(()=>{i++;show()},good?1500:2600)}

function finish(){
 $('#s1').classList.add('hide');$('#s2').classList.remove('hide');
 const sc=Math.round(ok*2.5*10)/10;
 setF('hop',0);frog.style.left=(42*100+110)+'px';cam(41);
 setTimeout(()=>{setF('party',0);sWin()},800);
 setTimeout(()=>{ [523,659,784,1047,784,1047].forEach((f,k)=>tone(f,k*.15,.2,'square',.12)) },2800);
 $('#res').textContent=name+' ('+kelas+') menjawab benar '+ok+' dari 40 soal.';
 $('#cn').textContent=name;$('#cc').textContent='Kelas '+kelas;$('#cs').textContent=sc+' / 100';
 $('#cd').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
</script></body></html>
